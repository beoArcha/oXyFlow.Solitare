name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect a documentation-only change
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$(cargo xtask affected --base "origin/$BASE_REF")" = "docs" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.docs != 'true'
        with:
          save-if: false
      - name: Install the ALSA development package for the audio feature
        if: steps.scope.outputs.docs != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev)
      - name: Check the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask check --pr "origin/$BASE_REF"
      - name: Clippy without the audio feature, as the Linux release is built
        if: steps.scope.outputs.docs != 'true'
        run: cargo clippy --no-default-features -p oxysol --all-targets -- -D warnings
      - name: Test without the audio feature
        if: steps.scope.outputs.docs != 'true'
        run: cargo test --no-default-features -p oxysol

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect a documentation-only change
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$(cargo xtask affected --base "origin/$BASE_REF")" = "docs" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.docs != 'true'
        with:
          save-if: false
      - name: Check the pull request
        run: cargo xtask check --pr origin/${{ github.base_ref }}

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      - name: Check licenses, advisories, sources and bans
        run: cargo deny --locked check licenses advisories sources bans

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MDBOOK_VERSION: v0.4.52
      MDBOOK_SHA256: c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changes to docs/site
        id: filter
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^docs/site/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mdBook
        if: steps.filter.outputs.changed == 'true'
        run: |
          set -eu
          dir="$RUNNER_TEMP/mdbook"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/mdbook.tar.gz" "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $dir/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$dir/mdbook.tar.gz" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Build the site
        if: steps.filter.outputs.changed == 'true'
        run: mdbook build docs/site
      - name: Check internal links
        if: steps.filter.outputs.changed == 'true'
        run: |
          broken=0
          while IFS= read -r html; do
            dir="$(dirname "$html")"
            while IFS= read -r link; do
              [ -z "$link" ] && continue
              if [[ "$link" =~ ^(https?:|mailto:|javascript:|#|/) || "$link" =~ (RELEASE_URL|\{\{|%7B%7B) ]]; then
                continue
              fi
              target="${link%%[#?]*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$html::Broken link '$link' (target '$dir/$target' not found)"
                broken=$((broken + 1))
              fi
            done < <(grep -oE '(href|src)="[^"]+"' "$html" | sed -E 's/^(href|src)="([^"]+)"/\2/')
          done < <(find docs/site/book -type f -name '*.html')
          if [ "$broken" -gt 0 ]; then
            echo "Found $broken broken link(s)"
            exit 1
          fi

  install-scripts-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint install.sh with ShellCheck
        run: |
          sh -n build/install.sh
          shellcheck build/install.sh
      - name: Lint install.ps1 with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path build/install.ps1 -EnableExit
      - name: Run --list on minimal Ubuntu container without ALSA headers
        run: |
          output="$(docker run --rm -v "$PWD:/work:ro" ubuntu:24.04 sh /work/build/install.sh --list)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'libasound2-dev'
          printf '%s\n' "$output" | grep -q 'pkg-config'

  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run install.sh --check and --list (Linux)
        if: runner.os == 'Linux'
        run: |
          sh build/install.sh --check --no-audio
          sh build/install.sh --list --no-audio
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
          sh build/install.sh --check
          sh build/install.sh --list
      - name: Run install.sh --check and --list (macOS)
        if: runner.os == 'macOS'
        run: |
          sh build/install.sh --check
          sh build/install.sh --list
      - name: Run install.ps1 --check and --list (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build/install.ps1 --check
          powershell -NoProfile -ExecutionPolicy Bypass -File build/install.ps1 --list
