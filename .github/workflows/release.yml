name: Release

on:
  workflow_dispatch:
    inputs:
      stable:
        description: "Publish the stable release v<version> instead of a pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse any ref but release
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/release" ]; then
            echo "::error::release.yml runs only on refs/heads/release, not on $REF"
            exit 1
          fi

  check:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install the ALSA development package for the audio feature
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Full check
        run: cargo xtask check

  tag:
    needs: [guard, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      stable: ${{ steps.compute.outputs.stable }}
      skip: ${{ steps.compute.outputs.skip }}
      promote: ${{ steps.compute.outputs.promote }}
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.stable == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute the tag and stop if this commit is already published
        id: compute
        run: |
          set -eu
          TAG=$(cargo xtask version --tag)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          skip=false
          promote=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists at $TAG_COMMIT, not at $GITHUB_SHA"
              exit 1
            fi
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              PRERELEASE=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)
              if [ "$STABLE" = "true" ] && [ "$PRERELEASE" = "true" ]; then
                echo "::notice::release $TAG is a pre-release of this commit; making it a full release"
                promote=true
              else
                echo "::notice::release $TAG already exists for this commit; nothing to publish"
              fi
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

  stabilize:
    needs: tag
    if: needs.tag.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Turn the pre-release into a full release
        run: gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest

  build:
    needs: [check, tag]
    if: needs.tag.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
            features: "--no-default-features"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
            features: "--no-default-features"
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add the Rust target
        run: rustup target add "$TARGET"
      - name: Release build
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo build --release --locked $FEATURES --target "$TARGET" -p oxysol
      - name: Install cargo-about
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-about@0.9.3,cargo-cyclonedx@0.5.10
      - name: Generate the third-party licenses
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo about generate --locked --fail $FEATURES about.hbs -o THIRD-PARTY-LICENSES.md
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          font_files=(
            "assets/fonts/oXySolMono-Regular.ttf"
            "assets/fonts/OFL.txt"
            "assets/fonts/NOTICE.md"
          )
          for f in "${font_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::required font file is missing: $f"
              exit 1
            fi
          done

          name="oxysol-$TAG-$TARGET"
          mkdir -p "dist/$name/fonts"
          cp "target/$TARGET/release/oxysol" README.md LICENSE THIRD-PARTY-LICENSES.md "dist/$name/"
          cp "${font_files[@]}" "dist/$name/fonts/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

          pname="oxysol-$TAG-$TARGET-portable"
          mkdir -p "dist/$pname/fonts"
          cp "target/$TARGET/release/oxysol" README.md LICENSE THIRD-PARTY-LICENSES.md "dist/$pname/"
          cp "${font_files[@]}" "dist/$pname/fonts/"
          printf '%s\n' \
            'This copy of oXySol is portable: it keeps its database and log in the "data" folder next to the program.' \
            'Delete this file to use the system data folder instead.' \
            > "dist/$pname/oxysol.portable"
          tar -C dist -czf "dist/$pname.tar.gz" "$pname"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontFiles = @(
            "assets/fonts/oXySolMono-Regular.ttf",
            "assets/fonts/OFL.txt",
            "assets/fonts/NOTICE.md"
          )
          foreach ($f in $fontFiles) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) {
              Write-Error "Required font file is missing: $f"
              exit 1
            }
          }

          $name = "oxysol-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$name/fonts" | Out-Null
          Copy-Item -Path "target/$env:TARGET/release/oxysol.exe", "README.md", "LICENSE", "THIRD-PARTY-LICENSES.md" -Destination "dist/$name"
          Copy-Item -Path $fontFiles -Destination "dist/$name/fonts"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

          $pname = "oxysol-$env:TAG-$env:TARGET-portable"
          New-Item -ItemType Directory -Force -Path "dist/$pname/fonts" | Out-Null
          Copy-Item -Path "target/$env:TARGET/release/oxysol.exe", "README.md", "LICENSE", "THIRD-PARTY-LICENSES.md" -Destination "dist/$pname"
          Copy-Item -Path $fontFiles -Destination "dist/$pname/fonts"
          $lines = @(
            'This copy of oXySol is portable: it keeps its database and log in the "data" folder next to the program.',
            'Delete this file to use the system data folder instead.'
          )
          Set-Content -Path "dist/$pname/oxysol.portable" -Value $lines -Encoding Ascii
          Compress-Archive -Path "dist/$pname" -DestinationPath "dist/$pname.zip"
      - name: Generate the SBOM (CycloneDX) from Cargo.lock
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -eu
          cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5             --target "$TARGET" $FEATURES --override-filename "oxysol-$TAG-$TARGET.sbom.cdx"
          mv "oxysol-$TAG-$TARGET.sbom.cdx.json" dist/
      - name: Attest the build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
      STABLE: ${{ needs.tag.outputs.stable }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: release
      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum oxysol-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the tag and the GitHub Release on the tested commit
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::release $TAG already exists; published assets are never replaced or edited"
            exit 1
          fi
          args=(--target "$GITHUB_SHA" --title "oXySol $TAG" --generate-notes)
          if [ "$STABLE" != "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$REPO" "${args[@]}" release/*

  site:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      REPO: ${{ github.repository }}
      MDBOOK_VERSION: v0.4.52
      MDBOOK_SHA256: c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        run: |
          set -eu
          dir="$RUNNER_TEMP/mdbook"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/mdbook.tar.gz" "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $dir/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$dir/mdbook.tar.gz" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Insert the version and the release link in every page, both languages
        run: |
          set -eu
          find docs/site/src -name '*.md' -print0 | xargs -0 sed -i \
            -e "s|{{VERSION}}|$TAG|g" \
            -e "s|{{RELEASE_URL}}|https://github.com/$REPO/releases/tag/$TAG|g"
          if grep -rn '{{' docs/site/src --include='*.md'; then
            echo "::error::a placeholder was left in the site pages"
            exit 1
          fi
      - name: Build the site
        run: mdbook build docs/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.1
        with:
          path: docs/site/book
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.0
