[package]
name = "oxysol"
description = "Ultimate Office Solitaire for the terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxysol"
path = "src/main.rs"

[features]
default = ["audio"]
audio = ["dep:cpal"]
dev-bridge = ["oxysol-tui/dev"]

[dependencies]
oxysol-core.workspace = true
oxysol-tui.workspace = true
arboard.workspace = true
cpal = { workspace = true, optional = true }
directories.workspace = true
midly.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = [".", "crates/core", "crates/tui", "xtask"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Marcin \"beoArcha\" Stefan"]
license = "MIT"
repository = "https://github.com/beoArcha/oXyFlow.Solitaire"
description = "Ultimate Office Solitaire for the terminal"

[workspace.dependencies]
oxysol-core = { path = "crates/core" }
oxysol-tui = { path = "crates/tui" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ratatui = "0.30.2"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.154"
directories = "6.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
syn = { version = "3.0.10", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
toml_edit = "0.25.19"
ra-ap-rustc_lexer = "0.186.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["local-offset"] }
midly = "0.5.3"
cpal = "0.18.2"
arboard = { version = "3.7.0", default-features = false }
resvg = { version = "0.50.0", default-features = false }
winresource = "0.1.34"

[profile.dev.package.oxysol-core]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
